  <!-- o check "se desenha": um traço invisível percorre o desenho da Geise e vai revelando o pincel -->
  <style>
    .traco { fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
    .anel { stroke-width: 2600; animation: desenhar .7s cubic-bezier(.5,0,.3,1) .1s forwards; }
    .vezinho { stroke-width: 2200; animation: desenhar .45s cubic-bezier(.5,0,.3,1) .75s forwards; }
    @keyframes desenhar { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .traco { animation: none; stroke-dashoffset: 0; } }
  </style>
